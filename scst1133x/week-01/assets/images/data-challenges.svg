<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="t"><title id="t">Common data ecosystem challenges</title><rect width="1200" height="570" rx="28" fill="#f7f8fa"/><text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#4e0d22">Common Challenges That Reduce Trust</text><g font-family="Arial"><g fill="#fff" stroke="#e4c76f" stroke-width="3"><rect x="55" y="95" width="330" height="175" rx="20"/><rect x="435" y="95" width="330" height="175" rx="20"/><rect x="815" y="95" width="330" height="175" rx="20"/><rect x="55" y="315" width="330" height="175" rx="20"/><rect x="435" y="315" width="330" height="175" rx="20"/><rect x="815" y="315" width="330" height="175" rx="20"/></g><g fill="#7b1734" font-size="21" font-weight="700"><text x="90" y="145">Missing Data</text><text x="470" y="145">Duplicate Records</text><text x="850" y="145">Inconsistent Information</text><text x="90" y="365">Outdated Information</text><text x="470" y="365">Unauthorised Access</text><text x="850" y="365">Unclear Ownership</text></g><g fill="#667085" font-size="16"><text x="90" y="185">A student record has no</text><text x="90" y="210">matric number.</text><text x="470" y="185">The same person appears</text><text x="470" y="210">more than once.</text><text x="850" y="185">Departments use different</text><text x="850" y="210">names for the same item.</text><text x="90" y="405">A telephone number is</text><text x="90" y="430">no longer correct.</text><text x="470" y="405">Sensitive records are visible</text><text x="470" y="430">to the wrong people.</text><text x="850" y="405">Nobody knows who should</text><text x="850" y="430">correct the record.</text></g></g></svg>
