<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">GitHub Desktop: Local-to-Remote Workflow</title><desc id="desc">Understand what happens before your files appear on GitHub. A commit records changes locally. A push sends those commits to GitHub.</desc><defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#4e0d22"/><stop offset=".7" stop-color="#7b1734"/><stop offset="1" stop-color="#9f445d"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17212b" flood-opacity=".12"/></filter><style>.title{font:800 50px Arial,sans-serif;fill:#fff}.sub{font:24px Arial,sans-serif;fill:#f4dfe6}.card-title{font:700 25px Arial,sans-serif;fill:#4e0d22}.body{font:21px Arial,sans-serif;fill:#4d5a68}.num{font:700 20px Arial,sans-serif;fill:#fff}.foot{font:700 23px Arial,sans-serif;fill:#17324f}</style></defs><rect width="1600" height="900" fill="#f5f7fa"/><rect width="1600" height="190" fill="url(#head)"/><circle cx="1485" cy="80" r="110" fill="#d8ad36" opacity=".22"/><text x="90" y="78" class="title">GitHub Desktop: Local-to-Remote Workflow</text><text x="92" y="125" class="sub">Understand what happens before your files appear on GitHub</text><g filter="url(#shadow)"><g><rect x="92" y="242" width="453.3333333333333" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="92" y="242" width="12" height="220" rx="6" fill="#7b1734"/><circle cx="134" cy="287" r="24" fill="#7b1734"/><text x="134" y="295" text-anchor="middle" class="num">1</text><text x="170" y="295" class="card-title"><tspan x="170" dy="0">1 · Edit Files</tspan></text><text x="122" y="328" class="body"><tspan x="122" dy="0">Change HTML, CSS, Markdown or</tspan><tspan x="122" dy="27">project assets locally.</tspan></text></g><g><rect x="573.3333333333333" y="242" width="453.3333333333333" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="573.3333333333333" y="242" width="12" height="220" rx="6" fill="#d2a337"/><circle cx="615.3333333333333" cy="287" r="24" fill="#d2a337"/><text x="615.3333333333333" y="295" text-anchor="middle" class="num">2</text><text x="651.3333333333333" y="295" class="card-title"><tspan x="651.3333333333333" dy="0">2 · Review Changes</tspan></text><text x="603.3333333333333" y="328" class="body"><tspan x="603.3333333333333" dy="0">Check exactly what was added,</tspan><tspan x="603.3333333333333" dy="27">modified or removed.</tspan></text></g><g><rect x="1054.6666666666665" y="242" width="453.3333333333333" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="1054.6666666666665" y="242" width="12" height="220" rx="6" fill="#17324f"/><circle cx="1096.6666666666665" cy="287" r="24" fill="#17324f"/><text x="1096.6666666666665" y="295" text-anchor="middle" class="num">3</text><text x="1132.6666666666665" y="295" class="card-title"><tspan x="1132.6666666666665" dy="0">3 · Write a Message</tspan></text><text x="1084.6666666666665" y="328" class="body"><tspan x="1084.6666666666665" dy="0">Summarise the purpose of the change</tspan><tspan x="1084.6666666666665" dy="27">clearly.</tspan></text></g><g><rect x="92" y="490" width="453.3333333333333" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="92" y="490" width="12" height="220" rx="6" fill="#7b1734"/><circle cx="134" cy="535" r="24" fill="#7b1734"/><text x="134" y="543" text-anchor="middle" class="num">4</text><text x="170" y="543" class="card-title"><tspan x="170" dy="0">4 · Commit Locally</tspan></text><text x="122" y="576" class="body"><tspan x="122" dy="0">Record a version in the repository</tspan><tspan x="122" dy="27">on your computer.</tspan></text></g><g><rect x="573.3333333333333" y="490" width="453.3333333333333" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="573.3333333333333" y="490" width="12" height="220" rx="6" fill="#d2a337"/><circle cx="615.3333333333333" cy="535" r="24" fill="#d2a337"/><text x="615.3333333333333" y="543" text-anchor="middle" class="num">5</text><text x="651.3333333333333" y="543" class="card-title"><tspan x="651.3333333333333" dy="0">5 · Push to GitHub</tspan></text><text x="603.3333333333333" y="576" class="body"><tspan x="603.3333333333333" dy="0">Send the new local commits to the</tspan><tspan x="603.3333333333333" dy="27">remote repository.</tspan></text></g><g><rect x="1054.6666666666665" y="490" width="453.3333333333333" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="1054.6666666666665" y="490" width="12" height="220" rx="6" fill="#17324f"/><circle cx="1096.6666666666665" cy="535" r="24" fill="#17324f"/><text x="1096.6666666666665" y="543" text-anchor="middle" class="num">6</text><text x="1132.6666666666665" y="543" class="card-title"><tspan x="1132.6666666666665" dy="0">6 · Pull Updates</tspan></text><text x="1084.6666666666665" y="576" class="body"><tspan x="1084.6666666666665" dy="0">Receive remote commits before</tspan><tspan x="1084.6666666666665" dy="27">continuing shared work.</tspan></text></g></g><rect x="90" y="815" width="1420" height="58" rx="18" fill="#fff7e3" stroke="#d8ad36" stroke-width="2"/><circle cx="126" cy="844" r="16" fill="#d8ad36"/><path d="M119 844l5 5 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="155" y="852" class="foot">A commit records changes locally. A push sends those commits to GitHub.</text></svg>