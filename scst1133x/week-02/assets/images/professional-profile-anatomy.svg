<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Anatomy of a Professional GitHub Profile</title><desc id="desc">Help a visitor understand your identity, interests and evidence quickly. A strong profile is specific, current and supported by working project evidence.</desc><defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#4e0d22"/><stop offset=".7" stop-color="#7b1734"/><stop offset="1" stop-color="#9f445d"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17212b" flood-opacity=".12"/></filter><style>.title{font:800 50px Arial,sans-serif;fill:#fff}.sub{font:24px Arial,sans-serif;fill:#f4dfe6}.card-title{font:700 25px Arial,sans-serif;fill:#4e0d22}.body{font:21px Arial,sans-serif;fill:#4d5a68}.num{font:700 20px Arial,sans-serif;fill:#fff}.foot{font:700 23px Arial,sans-serif;fill:#17324f}</style></defs><rect width="1600" height="900" fill="#f5f7fa"/><rect width="1600" height="190" fill="url(#head)"/><circle cx="1485" cy="80" r="110" fill="#d8ad36" opacity=".22"/><text x="90" y="78" class="title">Anatomy of a Professional GitHub Profile</text><text x="92" y="125" class="sub">Help a visitor understand your identity, interests and evidence quickly</text><g filter="url(#shadow)"><g><rect x="92" y="242" width="453.3333333333333" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="92" y="242" width="12" height="220" rx="6" fill="#7b1734"/><circle cx="134" cy="287" r="24" fill="#7b1734"/><text x="134" y="295" text-anchor="middle" class="num">1</text><text x="170" y="295" class="card-title"><tspan x="170" dy="0">Identity</tspan></text><text x="122" y="328" class="body"><tspan x="122" dy="0">Professional username, suitable</tspan><tspan x="122" dy="27">avatar and concise biography.</tspan></text></g><g><rect x="573.3333333333333" y="242" width="453.3333333333333" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="573.3333333333333" y="242" width="12" height="220" rx="6" fill="#d2a337"/><circle cx="615.3333333333333" cy="287" r="24" fill="#d2a337"/><text x="615.3333333333333" y="295" text-anchor="middle" class="num">2</text><text x="651.3333333333333" y="295" class="card-title"><tspan x="651.3333333333333" dy="0">Profile README</tspan></text><text x="603.3333333333333" y="328" class="body"><tspan x="603.3333333333333" dy="0">Current learning focus, skills and</tspan><tspan x="603.3333333333333" dy="27">selected achievements.</tspan></text></g><g><rect x="1054.6666666666665" y="242" width="453.3333333333333" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="1054.6666666666665" y="242" width="12" height="220" rx="6" fill="#17324f"/><circle cx="1096.6666666666665" cy="287" r="24" fill="#17324f"/><text x="1096.6666666666665" y="295" text-anchor="middle" class="num">3</text><text x="1132.6666666666665" y="295" class="card-title"><tspan x="1132.6666666666665" dy="0">Pinned Repositories</tspan></text><text x="1084.6666666666665" y="328" class="body"><tspan x="1084.6666666666665" dy="0">Two to six projects that best</tspan><tspan x="1084.6666666666665" dy="27">demonstrate your work.</tspan></text></g><g><rect x="92" y="490" width="453.3333333333333" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="92" y="490" width="12" height="220" rx="6" fill="#7b1734"/><circle cx="134" cy="535" r="24" fill="#7b1734"/><text x="134" y="543" text-anchor="middle" class="num">4</text><text x="170" y="543" class="card-title"><tspan x="170" dy="0">Repository Quality</tspan></text><text x="122" y="576" class="body"><tspan x="122" dy="0">Clear names, descriptions, topics,</tspan><tspan x="122" dy="27">README and licence.</tspan></text></g><g><rect x="573.3333333333333" y="490" width="453.3333333333333" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="573.3333333333333" y="490" width="12" height="220" rx="6" fill="#d2a337"/><circle cx="615.3333333333333" cy="535" r="24" fill="#d2a337"/><text x="615.3333333333333" y="543" text-anchor="middle" class="num">5</text><text x="651.3333333333333" y="543" class="card-title"><tspan x="651.3333333333333" dy="0">Professional Links</tspan></text><text x="603.3333333333333" y="576" class="body"><tspan x="603.3333333333333" dy="0">Tested portfolio and LinkedIn links</tspan><tspan x="603.3333333333333" dy="27">where appropriate.</tspan></text></g><g><rect x="1054.6666666666665" y="490" width="453.3333333333333" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="1054.6666666666665" y="490" width="12" height="220" rx="6" fill="#17324f"/><circle cx="1096.6666666666665" cy="535" r="24" fill="#17324f"/><text x="1096.6666666666665" y="543" text-anchor="middle" class="num">6</text><text x="1132.6666666666665" y="543" class="card-title"><tspan x="1132.6666666666665" dy="0">Authentic Evidence</tspan></text><text x="1084.6666666666665" y="576" class="body"><tspan x="1084.6666666666665" dy="0">Your contribution, decisions,</tspan><tspan x="1084.6666666666665" dy="27">progress and reflection.</tspan></text></g></g><rect x="90" y="815" width="1420" height="58" rx="18" fill="#fff7e3" stroke="#d8ad36" stroke-width="2"/><circle cx="126" cy="844" r="16" fill="#d8ad36"/><path d="M119 844l5 5 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="155" y="852" class="foot">A strong profile is specific, current and supported by working project evidence.</text></svg>