<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Publishing with GitHub Pages</title><desc id="desc">A deployment pipeline turns repository files into a public website. A pushed commit is not automatically a successful deployment—check Pages status.</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#d8ad36"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#243142" flood-opacity=".12"/></filter><style>.title{font:800 48px Arial,sans-serif;fill:#4e0d22}.sub{font:23px Arial,sans-serif;fill:#5f6b7a}.boxTitle{font:700 25px Arial,sans-serif;fill:#4e0d22}.body{font:20px Arial,sans-serif;fill:#253244}.small{font:18px Arial,sans-serif;fill:#5f6b7a}.label{font:700 21px Arial,sans-serif;fill:#fff}.num{font:700 22px Arial,sans-serif;fill:#fff}.foot{font:700 23px Arial,sans-serif;fill:#245c78}</style></defs><rect width="1600" height="900" fill="#fbf7f8"/><text x="800" y="68" class="title" text-anchor="middle">Publishing with GitHub Pages</text><text x="800" y="112" class="sub" text-anchor="middle">A deployment pipeline turns repository files into a public website</text><g><rect x="70" y="305" width="240" height="220" rx="24" fill="#fff" stroke="#245c78" stroke-width="3"/><rect x="70" y="305" width="240" height="14" rx="7" fill="#245c78"/><text x="190" y="367" class="boxTitle" text-anchor="middle"><tspan x="190" dy="0">Local Files</tspan></text><text x="190" y="421" class="body" text-anchor="middle"><tspan x="190" dy="0">index.html and assets</tspan></text></g><path d="M315 415 L362 415" stroke="#d8ad36" stroke-width="10" fill="none" marker-end="url(#arrow)"/><g><rect x="372" y="305" width="240" height="220" rx="24" fill="#fff" stroke="#245c78" stroke-width="3"/><rect x="372" y="305" width="240" height="14" rx="7" fill="#245c78"/><text x="492" y="367" class="boxTitle" text-anchor="middle"><tspan x="492" dy="0">Repository</tspan></text><text x="492" y="421" class="body" text-anchor="middle"><tspan x="492" dy="0">Latest commit pushed</tspan></text></g><path d="M617 415 L664 415" stroke="#d8ad36" stroke-width="10" fill="none" marker-end="url(#arrow)"/><g><rect x="674" y="305" width="240" height="220" rx="24" fill="#fff" stroke="#d8ad36" stroke-width="3"/><rect x="674" y="305" width="240" height="14" rx="7" fill="#d8ad36"/><text x="794" y="367" class="boxTitle" text-anchor="middle"><tspan x="794" dy="0">Pages Build</tspan></text><text x="794" y="421" class="body" text-anchor="middle"><tspan x="794" dy="0">Branch and folder selected</tspan></text></g><path d="M919 415 L966 415" stroke="#d8ad36" stroke-width="10" fill="none" marker-end="url(#arrow)"/><g><rect x="976" y="305" width="240" height="220" rx="24" fill="#fff" stroke="#245c78" stroke-width="3"/><rect x="976" y="305" width="240" height="14" rx="7" fill="#245c78"/><text x="1096" y="367" class="boxTitle" text-anchor="middle"><tspan x="1096" dy="0">Deployment</tspan></text><text x="1096" y="421" class="body" text-anchor="middle"><tspan x="1096" dy="0">Build completed</tspan></text></g><path d="M1221 415 L1268 415" stroke="#d8ad36" stroke-width="10" fill="none" marker-end="url(#arrow)"/><g><rect x="1278" y="305" width="240" height="220" rx="24" fill="#fff" stroke="#287c62" stroke-width="3"/><rect x="1278" y="305" width="240" height="14" rx="7" fill="#287c62"/><text x="1398" y="367" class="boxTitle" text-anchor="middle"><tspan x="1398" dy="0">Public Website</tspan></text><text x="1398" y="421" class="body" text-anchor="middle"><tspan x="1398" dy="0">URL tested privately</tspan></text></g><rect x="260" y="595" width="1080" height="105" rx="22" fill="#fff" stroke="#7b1734" stroke-width="3"/><text x="800" y="635" class="boxTitle" text-anchor="middle"><tspan x="800" dy="0">Troubleshooting checks</tspan></text><text x="800" y="675" class="body" text-anchor="middle"><tspan x="800" dy="0">index.html exists · correct source · matching letter case · deployment completed</tspan></text><rect x="120" y="818" width="1360" height="55" rx="18" fill="#fff7e4" stroke="#d8ad36" stroke-width="2"/><circle cx="157" cy="845" r="16" fill="#d8ad36"/><path d="M149 845l6 6 11-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="190" y="853" class="foot" text-anchor="start"><tspan x="190" dy="0">A pushed commit is not automatically a successful deployment—check Pages status.</tspan></text></svg>