<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The GitHub Learning Ecosystem</title><desc id="desc">A repository connects identity, documentation, history and publishing. GitHub is a record of how a project develops—not only a place to store files.</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#d8ad36"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#243142" flood-opacity=".12"/></filter><style>.title{font:800 48px Arial,sans-serif;fill:#4e0d22}.sub{font:23px Arial,sans-serif;fill:#5f6b7a}.boxTitle{font:700 25px Arial,sans-serif;fill:#4e0d22}.body{font:20px Arial,sans-serif;fill:#253244}.small{font:18px Arial,sans-serif;fill:#5f6b7a}.label{font:700 21px Arial,sans-serif;fill:#fff}.num{font:700 22px Arial,sans-serif;fill:#fff}.foot{font:700 23px Arial,sans-serif;fill:#245c78}</style></defs><rect width="1600" height="900" fill="#fbf7f8"/><text x="800" y="68" class="title" text-anchor="middle">The GitHub Learning Ecosystem</text><text x="800" y="112" class="sub" text-anchor="middle">A repository connects identity, documentation, history and publishing</text><circle cx="800" cy="445" r="145" fill="#7b1734"/><text x="800" y="430" class="label" text-anchor="middle"><tspan x="800" dy="0">Repository</tspan></text><text x="800" y="470" class="label" text-anchor="middle"><tspan x="800" dy="0">Project centre</tspan></text><line x1="800" y1="445" x2="350" y2="230" stroke="#d8ad36" stroke-width="6"/><g><rect x="215" y="160" width="270" height="140" rx="24" fill="#fff" stroke="#245c78" stroke-width="3"/><rect x="215" y="160" width="270" height="14" rx="7" fill="#245c78"/><text x="350" y="222" class="boxTitle" text-anchor="middle"><tspan x="350" dy="0">Profile</tspan></text><text x="350" y="276" class="body" text-anchor="middle"><tspan x="350" dy="0">Identity &amp; selected work</tspan></text></g><line x1="800" y1="445" x2="800" y2="190" stroke="#d8ad36" stroke-width="6"/><g><rect x="665" y="120" width="270" height="140" rx="24" fill="#fff" stroke="#245c78" stroke-width="3"/><rect x="665" y="120" width="270" height="14" rx="7" fill="#245c78"/><text x="800" y="182" class="boxTitle" text-anchor="middle"><tspan x="800" dy="0">README</tspan></text><text x="800" y="236" class="body" text-anchor="middle"><tspan x="800" dy="0">Purpose, setup &amp; evidence</tspan></text></g><line x1="800" y1="445" x2="1250" y2="230" stroke="#d8ad36" stroke-width="6"/><g><rect x="1115" y="160" width="270" height="140" rx="24" fill="#fff" stroke="#245c78" stroke-width="3"/><rect x="1115" y="160" width="270" height="14" rx="7" fill="#245c78"/><text x="1250" y="222" class="boxTitle" text-anchor="middle"><tspan x="1250" dy="0">Files</tspan></text><text x="1250" y="276" class="body" text-anchor="middle"><tspan x="1250" dy="0">Organised project assets</tspan></text></g><line x1="800" y1="445" x2="350" y2="650" stroke="#d8ad36" stroke-width="6"/><g><rect x="215" y="580" width="270" height="140" rx="24" fill="#fff" stroke="#245c78" stroke-width="3"/><rect x="215" y="580" width="270" height="14" rx="7" fill="#245c78"/><text x="350" y="642" class="boxTitle" text-anchor="middle"><tspan x="350" dy="0">Commits</tspan></text><text x="350" y="696" class="body" text-anchor="middle"><tspan x="350" dy="0">Meaningful change history</tspan></text></g><line x1="800" y1="445" x2="800" y2="700" stroke="#d8ad36" stroke-width="6"/><g><rect x="665" y="630" width="270" height="140" rx="24" fill="#fff" stroke="#245c78" stroke-width="3"/><rect x="665" y="630" width="270" height="14" rx="7" fill="#245c78"/><text x="800" y="692" class="boxTitle" text-anchor="middle"><tspan x="800" dy="0">Collaboration</tspan></text><text x="800" y="746" class="body" text-anchor="middle"><tspan x="800" dy="0">Issues, branches &amp; review</tspan></text></g><line x1="800" y1="445" x2="1250" y2="650" stroke="#d8ad36" stroke-width="6"/><g><rect x="1115" y="580" width="270" height="140" rx="24" fill="#fff" stroke="#287c62" stroke-width="3"/><rect x="1115" y="580" width="270" height="14" rx="7" fill="#287c62"/><text x="1250" y="642" class="boxTitle" text-anchor="middle"><tspan x="1250" dy="0">GitHub Pages</tspan></text><text x="1250" y="696" class="body" text-anchor="middle"><tspan x="1250" dy="0">Published static website</tspan></text></g><rect x="120" y="818" width="1360" height="55" rx="18" fill="#fff7e4" stroke="#d8ad36" stroke-width="2"/><circle cx="157" cy="845" r="16" fill="#d8ad36"/><path d="M149 845l6 6 11-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="190" y="853" class="foot" text-anchor="start"><tspan x="190" dy="0">GitHub is a record of how a project develops—not only a place to store files.</tspan></text></svg>