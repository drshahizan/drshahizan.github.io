<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">GitHub Desktop: Local-to-Remote Cycle</title><desc id="desc">The workflow repeats as a project changes. A commit records changes locally; a push sends those commits to GitHub.</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#d8ad36"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#243142" flood-opacity=".12"/></filter><style>.title{font:800 48px Arial,sans-serif;fill:#4e0d22}.sub{font:23px Arial,sans-serif;fill:#5f6b7a}.boxTitle{font:700 25px Arial,sans-serif;fill:#4e0d22}.body{font:20px Arial,sans-serif;fill:#253244}.small{font:18px Arial,sans-serif;fill:#5f6b7a}.label{font:700 21px Arial,sans-serif;fill:#fff}.num{font:700 22px Arial,sans-serif;fill:#fff}.foot{font:700 23px Arial,sans-serif;fill:#245c78}</style></defs><rect width="1600" height="900" fill="#fbf7f8"/><text x="800" y="68" class="title" text-anchor="middle">GitHub Desktop: Local-to-Remote Cycle</text><text x="800" y="112" class="sub" text-anchor="middle">The workflow repeats as a project changes</text><circle cx="800" cy="450" r="135" fill="#7b1734"/><text x="800" y="430" class="label" text-anchor="middle"><tspan x="800" dy="0">Local</tspan></text><text x="800" y="468" class="label" text-anchor="middle"><tspan x="800" dy="0">Repository</tspan></text><path d="M800 175a275 275 0 1 1-1 0" fill="none" stroke="#d8ad36" stroke-width="8" marker-end="url(#arrow)"/><g><rect x="675" y="140" width="250" height="130" rx="24" fill="#fff" stroke="#245c78" stroke-width="3"/><rect x="675" y="140" width="250" height="14" rx="7" fill="#245c78"/><text x="800" y="202" class="boxTitle" text-anchor="middle"><tspan x="800" dy="0">Edit Files</tspan></text><text x="800" y="256" class="body" text-anchor="middle"><tspan x="800" dy="0">Change project files</tspan></text></g><g><rect x="908.0088464923126" y="309.2908363781379" width="250" height="130" rx="24" fill="#fff" stroke="#245c78" stroke-width="3"/><rect x="908.0088464923126" y="309.2908363781379" width="250" height="14" rx="7" fill="#245c78"/><text x="1033.0088464923126" y="371.2908363781379" class="boxTitle" text-anchor="middle"><tspan x="1033.0088464923126" dy="0">Review Changes</tspan></text><text x="1033.0088464923126" y="425.2908363781379" class="body" text-anchor="middle"><tspan x="1033.0088464923126" dy="0">Inspect modifications</tspan></text></g><g><rect x="819.0073868116559" y="583.2091636218621" width="250" height="130" rx="24" fill="#fff" stroke="#245c78" stroke-width="3"/><rect x="819.0073868116559" y="583.2091636218621" width="250" height="14" rx="7" fill="#245c78"/><text x="944.0073868116559" y="645.2091636218621" class="boxTitle" text-anchor="middle"><tspan x="944.0073868116559" dy="0">Commit Locally</tspan></text><text x="944.0073868116559" y="699.2091636218621" class="body" text-anchor="middle"><tspan x="944.0073868116559" dy="0">Create a recorded version</tspan></text></g><g><rect x="530.9926131883441" y="583.2091636218621" width="250" height="130" rx="24" fill="#fff" stroke="#287c62" stroke-width="3"/><rect x="530.9926131883441" y="583.2091636218621" width="250" height="14" rx="7" fill="#287c62"/><text x="655.9926131883441" y="645.2091636218621" class="boxTitle" text-anchor="middle"><tspan x="655.9926131883441" dy="0">Push to GitHub</tspan></text><text x="655.9926131883441" y="699.2091636218621" class="body" text-anchor="middle"><tspan x="655.9926131883441" dy="0">Send commits to GitHub</tspan></text></g><g><rect x="441.9911535076874" y="309.2908363781378" width="250" height="130" rx="24" fill="#fff" stroke="#245c78" stroke-width="3"/><rect x="441.9911535076874" y="309.2908363781378" width="250" height="14" rx="7" fill="#245c78"/><text x="566.9911535076874" y="371.2908363781378" class="boxTitle" text-anchor="middle"><tspan x="566.9911535076874" dy="0">Pull Updates</tspan></text><text x="566.9911535076874" y="425.2908363781378" class="body" text-anchor="middle"><tspan x="566.9911535076874" dy="0">Receive remote changes</tspan></text></g><rect x="120" y="818" width="1360" height="55" rx="18" fill="#fff7e4" stroke="#d8ad36" stroke-width="2"/><circle cx="157" cy="845" r="16" fill="#d8ad36"/><path d="M149 845l6 6 11-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="190" y="853" class="foot" text-anchor="start"><tspan x="190" dy="0">A commit records changes locally; a push sends those commits to GitHub.</tspan></text></svg>