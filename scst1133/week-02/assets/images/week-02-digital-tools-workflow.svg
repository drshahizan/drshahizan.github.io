<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Week 2 Digital Tools Workflow</title><desc id="desc">A connected workflow from project setup to technical communication. Each tool produces evidence that becomes part of one learning portfolio.</desc><defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#4e0d22"/><stop offset=".7" stop-color="#7b1734"/><stop offset="1" stop-color="#9f445d"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17212b" flood-opacity=".12"/></filter><style>.title{font:800 50px Arial,sans-serif;fill:#fff}.sub{font:24px Arial,sans-serif;fill:#f4dfe6}.card-title{font:700 25px Arial,sans-serif;fill:#4e0d22}.body{font:21px Arial,sans-serif;fill:#4d5a68}.num{font:700 20px Arial,sans-serif;fill:#fff}.foot{font:700 23px Arial,sans-serif;fill:#17324f}</style></defs><rect width="1600" height="900" fill="#f5f7fa"/><rect width="1600" height="190" fill="url(#head)"/><circle cx="1485" cy="80" r="110" fill="#d8ad36" opacity=".22"/><text x="90" y="78" class="title">Week 2 Digital Tools Workflow</text><text x="92" y="125" class="sub">A connected workflow from project setup to technical communication</text><g filter="url(#shadow)"><g><rect x="92" y="242" width="694" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="92" y="242" width="12" height="220" rx="6" fill="#7b1734"/><circle cx="134" cy="287" r="24" fill="#7b1734"/><text x="134" y="295" text-anchor="middle" class="num">1</text><text x="170" y="295" class="card-title"><tspan x="170" dy="0">GitHub</tspan></text><text x="122" y="328" class="body"><tspan x="122" dy="0">Manage files, document work and publish a website.</tspan></text></g><g><rect x="814" y="242" width="694" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="814" y="242" width="12" height="220" rx="6" fill="#d2a337"/><circle cx="856" cy="287" r="24" fill="#d2a337"/><text x="856" y="295" text-anchor="middle" class="num">2</text><text x="892" y="295" class="card-title"><tspan x="892" dy="0">Figma</tspan></text><text x="844" y="328" class="body"><tspan x="844" dy="0">Structure requirements as a reusable interface</tspan><tspan x="844" dy="27">prototype.</tspan></text></g><g><rect x="92" y="490" width="694" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="92" y="490" width="12" height="220" rx="6" fill="#17324f"/><circle cx="134" cy="535" r="24" fill="#17324f"/><text x="134" y="543" text-anchor="middle" class="num">3</text><text x="170" y="543" class="card-title"><tspan x="170" dy="0">Google Stitch</tspan></text><text x="122" y="576" class="body"><tspan x="122" dy="0">Generate an alternative interface from a structured</tspan><tspan x="122" dy="27">prompt.</tspan></text></g><g><rect x="814" y="490" width="694" height="220" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/><rect x="814" y="490" width="12" height="220" rx="6" fill="#7b1734"/><circle cx="856" cy="535" r="24" fill="#7b1734"/><text x="856" y="543" text-anchor="middle" class="num">4</text><text x="892" y="543" class="card-title"><tspan x="892" dy="0">Google Vids</tspan></text><text x="844" y="576" class="body"><tspan x="844" dy="0">Present the problem, process, output and reflection.</tspan></text></g></g><rect x="90" y="815" width="1420" height="58" rx="18" fill="#fff7e3" stroke="#d8ad36" stroke-width="2"/><circle cx="126" cy="844" r="16" fill="#d8ad36"/><path d="M119 844l5 5 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="155" y="852" class="foot">Each tool produces evidence that becomes part of one learning portfolio.</text></svg>