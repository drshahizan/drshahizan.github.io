<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="t"><title id="t">General journey of university course registration data</title><rect width="1400" height="430" rx="28" fill="#faf7f8"/><text x="700" y="55" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#4e0d22">The General Data Journey</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#d8ad36" stroke-width="3"><rect x="40" y="130" width="190" height="165" rx="18"/><rect x="265" y="130" width="190" height="165" rx="18"/><rect x="490" y="130" width="190" height="165" rx="18"/><rect x="715" y="130" width="190" height="165" rx="18"/><rect x="940" y="130" width="190" height="165" rx="18"/><rect x="1165" y="130" width="190" height="165" rx="18"/></g><g fill="#7b1734" font-weight="700"><text x="135" y="180">1. Generated</text><text x="360" y="180">2. Collected</text><text x="585" y="180">3. Organised</text><text x="810" y="180">4. Checked</text><text x="1035" y="180">5. Available</text><text x="1260" y="180">6. Used</text></g><g fill="#667085" font-size="15"><text x="135" y="220">Student selects</text><text x="135" y="244">a course</text><text x="360" y="220">Registration</text><text x="360" y="244">is recorded</text><text x="585" y="220">Student and course</text><text x="585" y="244">are connected</text><text x="810" y="220">Record validity</text><text x="810" y="244">is confirmed</text><text x="1035" y="220">Authorised users</text><text x="1035" y="244">can access it</text><text x="1260" y="220">Class list and</text><text x="1260" y="244">planning</text></g></g><g fill="#245c78"><path d="M230 205h25v-12l17 20-17 20v-12h-25z"/><path d="M455 205h25v-12l17 20-17 20v-12h-25z"/><path d="M680 205h25v-12l17 20-17 20v-12h-25z"/><path d="M905 205h25v-12l17 20-17 20v-12h-25z"/><path d="M1130 205h25v-12l17 20-17 20v-12h-25z"/></g><text x="700" y="365" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#245c78">Each stage adds responsibility, context and value.</text></svg>
