<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Week 2 Submission Quality Gates</title><desc id="desc">Pass every check before the final submission. A correct URL is incomplete if the lecturer cannot open it.</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#d8ad36"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#243142" flood-opacity=".12"/></filter><style>.title{font:800 48px Arial,sans-serif;fill:#4e0d22}.sub{font:23px Arial,sans-serif;fill:#5f6b7a}.boxTitle{font:700 25px Arial,sans-serif;fill:#4e0d22}.body{font:20px Arial,sans-serif;fill:#253244}.small{font:18px Arial,sans-serif;fill:#5f6b7a}.label{font:700 21px Arial,sans-serif;fill:#fff}.num{font:700 22px Arial,sans-serif;fill:#fff}.foot{font:700 23px Arial,sans-serif;fill:#245c78}</style></defs><rect width="1600" height="900" fill="#fbf7f8"/><text x="800" y="68" class="title" text-anchor="middle">Week 2 Submission Quality Gates</text><text x="800" y="112" class="sub" text-anchor="middle">Pass every check before the final submission</text><path d="M50 230h205l30 85-30 85H50l30-85Z" fill="#7b1734"/><text x="165" y="380" class="label" text-anchor="middle"><tspan x="165" dy="0">Content Complete</tspan></text><text x="165" y="425" class="small" text-anchor="middle"><tspan x="165" dy="0">Required sections and</tspan><tspan x="165" dy="27">evidence</tspan></text><path d="M305 295h205l30 85-30 85H305l30-85Z" fill="#245c78"/><text x="420" y="445" class="label" text-anchor="middle"><tspan x="420" dy="0">Committed</tspan></text><text x="420" y="490" class="small" text-anchor="middle"><tspan x="420" dy="0">Latest files pushed</tspan></text><path d="M560 360h205l30 85-30 85H560l30-85Z" fill="#7b1734"/><text x="675" y="510" class="label" text-anchor="middle"><tspan x="675" dy="0">Published</tspan></text><text x="675" y="555" class="small" text-anchor="middle"><tspan x="675" dy="0">Website deployment</tspan><tspan x="675" dy="27">works</tspan></text><path d="M815 425h205l30 85-30 85H815l30-85Z" fill="#245c78"/><text x="930" y="575" class="label" text-anchor="middle"><tspan x="930" dy="0">Accessible</tspan></text><text x="930" y="620" class="small" text-anchor="middle"><tspan x="930" dy="0">Viewer permissions</tspan><tspan x="930" dy="27">correct</tspan></text><path d="M1070 490h205l30 85-30 85H1070l30-85Z" fill="#7b1734"/><text x="1185" y="640" class="label" text-anchor="middle"><tspan x="1185" dy="0">Verified</tspan></text><text x="1185" y="685" class="small" text-anchor="middle"><tspan x="1185" dy="0">Links tested privately</tspan></text><path d="M1325 555h205l30 85-30 85H1325l30-85Z" fill="#287c62"/><text x="1440" y="705" class="label" text-anchor="middle"><tspan x="1440" dy="0">Ready</tspan></text><text x="1440" y="750" class="small" text-anchor="middle"><tspan x="1440" dy="0">Submit required URLs</tspan></text><rect x="330" y="690" width="940" height="70" rx="22" fill="#fff" stroke="#d8ad36" stroke-width="3"/><text x="800" y="733" class="boxTitle" text-anchor="middle"><tspan x="800" dy="0">Content → Version → Deployment → Access → Verification → Submission</tspan></text><rect x="120" y="818" width="1360" height="55" rx="18" fill="#fff7e4" stroke="#d8ad36" stroke-width="2"/><circle cx="157" cy="845" r="16" fill="#d8ad36"/><path d="M149 845l6 6 11-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="190" y="853" class="foot" text-anchor="start"><tspan x="190" dy="0">A correct URL is incomplete if the lecturer cannot open it.</tspan></text></svg>