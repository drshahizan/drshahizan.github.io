<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Anatomy of a Professional GitHub Profile</title><desc id="desc">Help visitors understand who you are and what you can build. Use selected, authentic and current project evidence; never expose private information.</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#d8ad36"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#243142" flood-opacity=".12"/></filter><style>.title{font:800 48px Arial,sans-serif;fill:#4e0d22}.sub{font:23px Arial,sans-serif;fill:#5f6b7a}.boxTitle{font:700 25px Arial,sans-serif;fill:#4e0d22}.body{font:20px Arial,sans-serif;fill:#253244}.small{font:18px Arial,sans-serif;fill:#5f6b7a}.label{font:700 21px Arial,sans-serif;fill:#fff}.num{font:700 22px Arial,sans-serif;fill:#fff}.foot{font:700 23px Arial,sans-serif;fill:#245c78}</style></defs><rect width="1600" height="900" fill="#fbf7f8"/><text x="800" y="68" class="title" text-anchor="middle">Anatomy of a Professional GitHub Profile</text><text x="800" y="112" class="sub" text-anchor="middle">Help visitors understand who you are and what you can build</text><g><rect x="430" y="180" width="740" height="550" rx="28" fill="#fff" stroke="#d9dee6" stroke-width="3"/><circle cx="565" cy="320" r="78" fill="#245c78"/><circle cx="565" cy="292" r="25" fill="#fff"/><path d="M515 365q50-70 100 0" fill="#fff"/><rect x="690" y="235" width="330" height="28" rx="14" fill="#7b1734"/><rect x="690" y="285" width="250" height="15" rx="7" fill="#b7c0cb"/><rect x="690" y="315" width="360" height="15" rx="7" fill="#d7dce3"/><rect x="500" y="435" width="600" height="90" rx="18" fill="#f7edf1"/><rect x="500" y="565" width="175" height="110" rx="16" fill="#eef3f6"/><rect x="712" y="565" width="175" height="110" rx="16" fill="#eef3f6"/><rect x="925" y="565" width="175" height="110" rx="16" fill="#eef3f6"/></g><line x1="245" y1="245" x2="480" y2="280" stroke="#d8ad36" stroke-width="4"/><circle cx="245" cy="245" r="8" fill="#d8ad36"/><text x="230" y="227" class="boxTitle" text-anchor="end"><tspan x="230" dy="0">Identity</tspan></text><line x1="1230" y1="250" x2="1035" y2="300" stroke="#d8ad36" stroke-width="4"/><circle cx="1230" cy="250" r="8" fill="#d8ad36"/><text x="1245" y="232" class="boxTitle" text-anchor="start"><tspan x="1245" dy="0">Bio &amp; links</tspan></text><line x1="220" y1="490" x2="500" y2="480" stroke="#d8ad36" stroke-width="4"/><circle cx="220" cy="490" r="8" fill="#d8ad36"/><text x="205" y="472" class="boxTitle" text-anchor="end"><tspan x="205" dy="0">Profile README</tspan></text><line x1="1235" y1="610" x2="1100" y2="620" stroke="#d8ad36" stroke-width="4"/><circle cx="1235" cy="610" r="8" fill="#d8ad36"/><text x="1250" y="592" class="boxTitle" text-anchor="start"><tspan x="1250" dy="0">Pinned repositories</tspan></text><line x1="260" y1="700" x2="500" y2="660" stroke="#d8ad36" stroke-width="4"/><circle cx="260" cy="700" r="8" fill="#d8ad36"/><text x="245" y="682" class="boxTitle" text-anchor="end"><tspan x="245" dy="0">Authentic evidence</tspan></text><rect x="120" y="818" width="1360" height="55" rx="18" fill="#fff7e4" stroke="#d8ad36" stroke-width="2"/><circle cx="157" cy="845" r="16" fill="#d8ad36"/><path d="M149 845l6 6 11-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="190" y="853" class="foot" text-anchor="start"><tspan x="190" dy="0">Use selected, authentic and current project evidence; never expose private information.</tspan></text></svg>