<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" rx="38" fill="#fff7ee"/><text x="70" y="105" font-family="Arial" font-size="34" font-weight="700" fill="#8b002b">PUBLISH OR PERISH</text><text x="70" y="165" font-family="Arial" font-size="46" font-weight="800" fill="#24151a">Daripada carian kepada tafsiran</text><g font-family="Arial"><g transform="translate(70 240)"><rect width="235" height="220" rx="25" fill="#fff" stroke="#eadde1"/><text x="28" y="70" font-size="25" font-weight="700" fill="#8b002b">1 · Cari</text><text x="28" y="116" font-size="19" fill="#6f6266">Pengarang, topik,</text><text x="28" y="148" font-size="19" fill="#6f6266">jurnal atau Scopus</text></g><g transform="translate(345 240)"><rect width="235" height="220" rx="25" fill="#fff" stroke="#eadde1"/><text x="28" y="70" font-size="25" font-weight="700" fill="#8b002b">2 · Bersihkan</text><text x="28" y="116" font-size="19" fill="#6f6266">Buang pendua dan</text><text x="28" y="148" font-size="19" fill="#6f6266">salah atribusi</text></g><g transform="translate(620 240)"><rect width="235" height="220" rx="25" fill="#fff" stroke="#eadde1"/><text x="28" y="70" font-size="25" font-weight="700" fill="#8b002b">3 · Metrik</text><text x="28" y="116" font-size="19" fill="#6f6266">Papers, citations,</text><text x="28" y="148" font-size="19" fill="#6f6266">h-index dan trend</text></g><g transform="translate(895 240)"><rect width="235" height="220" rx="25" fill="#fff" stroke="#eadde1"/><text x="28" y="70" font-size="25" font-weight="700" fill="#8b002b">4 · Eksport</text><text x="28" y="116" font-size="19" fill="#6f6266">CSV, RIS atau</text><text x="28" y="148" font-size="19" fill="#6f6266">BibTeX</text></g></g><text x="600" y="560" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#59001f">Semak konteks artikel sebelum membuat kesimpulan.</text></svg>
