<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" rx="38" fill="#fff5ec"/><text x="70" y="105" font-family="Arial" font-size="34" font-weight="700" fill="#b9460d">SCOPUS AI</text><text x="70" y="165" font-family="Arial" font-size="46" font-weight="800" fill="#24151a">Teroka, semak dan kembali kepada sumber</text><g font-family="Arial"><g transform="translate(70 240)"><rect width="235" height="220" rx="25" fill="#fff" stroke="#f1d7c8"/><text x="28" y="70" font-size="25" font-weight="700" fill="#b9460d">1 · Pertanyaan</text><text x="28" y="116" font-size="19" fill="#6f6266">Topik, konteks</text><text x="28" y="148" font-size="19" fill="#6f6266">dan tujuan</text></g><g transform="translate(345 240)"><rect width="235" height="220" rx="25" fill="#fff" stroke="#f1d7c8"/><text x="28" y="70" font-size="25" font-weight="700" fill="#b9460d">2 · Ringkasan</text><text x="28" y="116" font-size="19" fill="#6f6266">Jawapan dan</text><text x="28" y="148" font-size="19" fill="#6f6266">peta konsep</text></g><g transform="translate(620 240)"><rect width="235" height="220" rx="25" fill="#fff" stroke="#f1d7c8"/><text x="28" y="70" font-size="25" font-weight="700" fill="#b9460d">3 · Rujukan</text><text x="28" y="116" font-size="19" fill="#6f6266">Jejak bukti setiap</text><text x="28" y="148" font-size="19" fill="#6f6266">dakwaan penting</text></g><g transform="translate(895 240)"><rect width="235" height="220" rx="25" fill="#fff" stroke="#f1d7c8"/><text x="28" y="70" font-size="25" font-weight="700" fill="#b9460d">4 · Artikel asal</text><text x="28" y="116" font-size="19" fill="#6f6266">Baca dan cite</text><text x="28" y="148" font-size="19" fill="#6f6266">sumber sebenar</text></g></g><text x="600" y="560" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#7c320e">Scopus AI membantu penerokaan. Ia tidak menggantikan tinjauan literatur.</text></svg>
