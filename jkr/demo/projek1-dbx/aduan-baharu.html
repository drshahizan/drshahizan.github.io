<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buat Aduan | JalanCare DB</title><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/db.css"></head><body class="public-page"><header class="public-header"><a class="brand" href="index.html"><span class="brand-mark">JKR</span><span><b>JalanCare DB</b><small>JKR Daerah Rembau</small></span></a><nav><a href="index.html">Utama</a><a class="active" href="aduan-baharu.html">Buat Aduan</a><a href="semakan.html">Semak Status</a><a class="staff-link" href="login.html">Log Masuk Staf</a></nav><button class="public-menu">☰</button></header><section class="subhead"><span class="eyebrow">ADUAN AWAM · GOOGLE SHEETS</span><h1>Laporkan kerosakan atau bahaya</h1><p>Rekod akan disimpan dalam Google Sheets dan nombor rujukan dijana secara automatik.</p></section><main class="form-shell"><form id="complaintForm" class="form-card"><h2>Maklumat aduan</h2><div class="form-grid"><div class="field"><label>Kategori aduan</label><select name="kategori" required><option value="">Pilih kategori</option><option>Jalan berlubang atau rosak</option><option>Kerosakan bahu jalan</option><option>Longkang tersumbat atau rosak</option><option>Banjir kilat atau air bertakung</option><option>Lampu jalan</option><option>Papan tanda rosak atau hilang</option><option>Pokok tumbang atau menghalang jalan</option><option>Cerun atau tanah runtuh</option></select></div><div class="field"><label>Tahap bahaya</label><select name="tahap" required><option>Rendah</option><option>Sederhana</option><option>Tinggi</option><option>Kritikal</option></select></div><div class="field full"><label>Tajuk ringkas</label><input name="tajuk" required placeholder="Contoh: Lubang besar berhampiran simpang sekolah"></div><div class="field full"><label>Keterangan kejadian</label><textarea name="keterangan" required placeholder="Terangkan keadaan, anggaran saiz dan risiko kepada pengguna jalan"></textarea></div><div class="field full"><label>Lokasi kejadian</label><input name="lokasi" required placeholder="Nama jalan, kilometer, taman atau tanda tempat"></div><div class="field"><label>Koordinat GPS</label><input name="koordinat" placeholder="2.5948, 102.0901"></div><div class="field"><label>Nombor jalan / laluan</label><input name="noLaluan" placeholder="Contoh: N14"></div></div><h2 style="margin-top:30px">Maklumat pengadu</h2><div class="form-grid"><div class="field"><label>Nama penuh</label><input name="nama" required></div><div class="field"><label>Nombor telefon</label><input name="telefon" required placeholder="01X-XXXXXXX"></div><div class="field"><label>Alamat e-mel</label><input name="emel" type="email"></div><div class="field"><label>Tarikh dan masa kejadian</label><input name="tarikhKejadian" type="datetime-local"></div><div class="field full"><label class="check"><input name="rahsia" type="checkbox"> Rahsiakan maklumat saya daripada paparan umum</label></div><div class="field full"><label class="check"><input type="checkbox" required> Saya mengesahkan maklumat yang diberikan adalah benar.</label></div></div><p id="formMessage" class="form-message"></p><div class="form-actions"><a class="secondary" href="index.html">Batal</a><button class="primary" type="submit">Hantar Aduan</button></div></form></main><footer class="public-footer"><span>© 2026 JalanCare JKR Daerah Rembau</span><a class="visitor-badge" href="https://visitorbadge.io/status?path=https%3A%2F%2Fgithub.com%2Fdrshahizan" target="_blank"><img src="https://api.visitorbadge.io/api/visitors?path=https%3A%2F%2Fgithub.com%2Fdrshahizan&amp;labelColor=%23697689&amp;countColor=%23555555&amp;style=plastic" alt="Bilangan pelawat laman"></a></footer><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/public.js"></script></body></html>
