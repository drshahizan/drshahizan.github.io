<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carian Portal JKR</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/course.css"><link rel="stylesheet" href="../assets/complete.css"></head><body><div class="topbar"><div class="container"><span>Carian Portal JKR</span><span>Modul · Latihan · Prompt · Sumber · Projek</span></div></div><header class="site-header"><nav class="nav container"><a class="brand" href="../"><span class="brand-mark">JKR</span><span><strong>Carian Portal</strong><small>Cari kandungan dengan pantas</small></span></a><button class="menu-btn">Menu</button><div class="nav-links"><a href="../">Utama</a><a href="../mula/">Mula</a><a href="../prompt-jkr/">Prompt</a><a href="../sumber-ai/">Sumber</a></div></nav></header><main><section class="page-hero"><div class="container"><span class="eyebrow">Carian setempat</span><h1>Apa yang anda cari?</h1><p>Masukkan kata kunci seperti laporan, aduan, slaid, dataset, prompt atau projek.</p></div></section><section class="section"><div class="container"><div class="prompt-controls" style="display:grid;grid-template-columns:1fr auto;gap:10px"><input id="search" type="search" placeholder="Cari kandungan…" style="padding:13px;border:1px solid var(--line);border-radius:9px"><button class="btn btn-primary" id="go">Cari</button></div><p id="count"></p><div class="search-results" id="results"></div></div></section></main><footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2026 Kursus Aplikasi AI dalam Tugas Rasmi · JKR</span></div></div></footer><script src="../assets/site.js"></script><script>const pages=[['Mula di Sini','Laluan peserta kemajuan persediaan','../mula/'],['Tentatif','Jadual modul hands-on rehat','../tentatif/'],['Pembelajaran AI','Asas prompt data sumber etika privasi','../pembelajaran-ai/'],['Latihan AI','Pilih alat klinik prompt analisis aduan minit audit','../latihan-ai/'],['Pusat Prompt JKR','58 prompt dokumen aduan pemeriksaan projek keputusan','../prompt-jkr/'],['Prompt Builder JKR','Bina prompt peranan proses maklumat hasil kawalan','../prompt-builder-jkr/'],['Alat AI','Gemini ChatGPT Notebook Canva Gamma Excel','../alat-ai/'],['Sumber AI','Templat kuiz glosari FAQ checklist','../sumber-ai/'],['Dataset','CSV Excel aduan SLA pemeriksaan projek','../dataset/'],['Kajian Kes','Jalan Kampung Sentosa laporan minit SOP','../kajian-kes/'],['Slaid Utama Kursus','61 slaid PDF AI Gemini Notebook Google Gemini prompt analisis data kandungan selamat','../bahan-kursus/slaid/'],['Video AI','video storyboard skrip Flow Kling CapCut produksi multimedia JKR','../video-ai/'],['Hands-on 2','Laporan teknikal profesional','../bahan-kursus/hands-on-2/'],['Hands-on 3','Pembentangan teknikal slaid','../bahan-kursus/hands-on-3/'],['Projek Web','Aduan JalanCare pendaftaran kursus database','../projek/'],['Maklum Balas','Penilaian kursus peserta','../maklum-balas/']];function run(){const q=document.querySelector('#search').value.toLowerCase().trim(),rows=pages.filter(x=>!q||x.join(' ').toLowerCase().includes(q));document.querySelector('#count').textContent=`${rows.length} hasil`;document.querySelector('#results').innerHTML=rows.map(x=>`<article class="search-result"><h3>${x[0]}</h3><p>${x[1]}</p><a class="text-link" href="${x[2]}">Buka halaman</a></article>`).join('')}document.querySelector('#go').onclick=run;document.querySelector('#search').oninput=run;run()</script></body></html>
