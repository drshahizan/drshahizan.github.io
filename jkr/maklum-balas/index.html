<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maklum Balas Kursus</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/course.css"><link rel="stylesheet" href="../assets/complete.css"></head><body><div class="topbar"><div class="container"><span>Maklum Balas Kursus</span><span>Disimpan pada peranti ini</span></div></div><header class="site-header"><nav class="nav container"><a class="brand" href="../"><span class="brand-mark">JKR</span><span><strong>Maklum Balas</strong><small>Penilaian kendiri kursus</small></span></a><button class="menu-btn">Menu</button><div class="nav-links"><a href="../">Utama</a><a href="../mula/">Mula</a><a href="../hantar-hasil/">Hasil</a></div></nav></header><main><section class="page-hero"><div class="container"><span class="eyebrow">Penambahbaikan berterusan</span><h1>Maklum balas peserta</h1><p>Versi ini menyimpan jawapan pada pelayar. Sambungan Google Sheets boleh ditambah kemudian.</p></div></section><section class="section"><div class="container"><form class="article-block form-grid" id="feedback"><label>Kesesuaian kandungan<select id="content"><option>5 — Sangat baik</option><option>4 — Baik</option><option>3 — Sederhana</option><option>2 — Kurang</option><option>1 — Lemah</option></select></label><label>Kejelasan penyampaian<select id="delivery"><option>5 — Sangat baik</option><option>4 — Baik</option><option>3 — Sederhana</option><option>2 — Kurang</option><option>1 — Lemah</option></select></label><label>Keyakinan sebelum kursus<select id="before"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Keyakinan selepas kursus<select id="after"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label class="span-2">Modul paling berguna<input id="useful"></label><label class="span-2">Cadangan penambahbaikan<textarea id="suggestion"></textarea></label><div class="span-2 actions"><button class="btn btn-primary" type="submit">Simpan Maklum Balas</button></div></form><div class="quiz-result" id="feedbackResult" hidden></div></div></section></main><footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2026 Kursus Aplikasi AI dalam Tugas Rasmi · JKR</span></div></div></footer><script src="../assets/site.js"></script><script>document.querySelector('#feedback').onsubmit=e=>{e.preventDefault();const d={content:content.value,delivery:delivery.value,before:before.value,after:after.value,useful:useful.value,suggestion:suggestion.value};localStorage.setItem('jkrFeedback',JSON.stringify(d));const p=JSON.parse(localStorage.getItem('jkrCourseProgressV1')||'{}');p.feedback=true;localStorage.setItem('jkrCourseProgressV1',JSON.stringify(p));const r=document.querySelector('#feedbackResult');r.hidden=false;r.textContent='Terima kasih. Maklum balas disimpan pada peranti ini.'}</script></body></html>
